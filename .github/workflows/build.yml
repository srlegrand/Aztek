name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # A fresh set of packages every hour, if main has moved since the last one.
  schedule:
    - cron: "7 * * * *"

# A build in progress finishes: cancelling it for each push meant a busy day released nothing. One newer run waits.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Whether there's anything to build: only the hourly run can find nothing new.
  gate:
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.check.outputs.go }}
      version: ${{ steps.check.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The version a user sees: 2.<commits on main>, so every build is newer than the last and says so.
      - id: check
        run: |
          version="2.$(git rev-list --count HEAD).0"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          go=true
          if [ "${{ github.event_name }}" = "schedule" ] && gh release view "v$version" >/dev/null 2>&1; then
            go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "Building $version: $go"

  linux:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: bash
        run: sed -i 's/^version = ".*"/version = "${{ needs.gate.outputs.version }}"/' Cargo.toml

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev cmake ninja-build qt6-base-dev libvulkan-dev python3-dev xvfb xdotool imagemagick openbox mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            . -> build/cargo

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: ./build.sh

      # The real binary with no display: exit statuses, then the basics end to end.
      - name: Batch
        run: AZTEK_BIN="$PWD/build/aztek" cargo test -p aztek_host --test batch --test basics --test basics_python

      - name: Examples
        run: tools/check_examples.sh build/aztek

      - name: Channel Box under Xvfb
        run: python3 tools/ui_checks/channel_box.py build/aztek

      - name: Package
        run: |
          tar -czf aztek-linux-x86_64.tar.gz -C build aztek -C .. examples
          packaging/deb/build-deb.sh build dist

      - uses: actions/upload-artifact@v4
        with:
          name: aztek-linux-x86_64
          path: aztek-linux-x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: aztek-deb-ubuntu24.04
          path: dist/*.deb

  # Ubuntu 22.04 has Qt 6.2 and Python 3.10, so it gets its own package.
  ubuntu-2204:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: bash
        run: sed -i 's/^version = ".*"/version = "${{ needs.gate.outputs.version }}"/' Cargo.toml

      - name: Dependencies
        run: |
          apt-get update
          apt-get install -y build-essential dpkg-dev cmake ninja-build qt6-base-dev libgl-dev libvulkan-dev python3-dev ca-certificates curl file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            . -> build/cargo

      - name: Test
        run: cargo test --workspace

      - name: Package
        run: packaging/deb/build-deb.sh build dist

      - uses: actions/upload-artifact@v4
        with:
          name: aztek-deb-ubuntu22.04
          path: dist/*.deb

  # Rocky 8 has no Qt 6 packages, so its RPM bundles Qt 6.8 from aqtinstall. Rocky 9 uses EPEL's Qt.
  rocky:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-24.04
    container: rockylinux:${{ matrix.el }}
    strategy:
      fail-fast: false
      matrix:
        el: [8, 9]
    env:
      PYO3_PYTHON: /usr/bin/python3.12
    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: bash
        run: sed -i 's/^version = ".*"/version = "${{ needs.gate.outputs.version }}"/' Cargo.toml

      - name: Dependencies
        run: packaging/rpm/install-build-deps.sh

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: el${{ matrix.el }}
          workspaces: |
            . -> target
            . -> build/cargo

      - name: Qt cache
        if: matrix.el == 8
        uses: actions/cache@v4
        with:
          path: /opt/qt
          key: qt-6.8.3-el8

      - name: Test
        run: cargo test --workspace

      - name: RPM
        run: packaging/rpm/build-rpm.sh build dist

      - uses: actions/upload-artifact@v4
        with:
          name: aztek-rpm-el${{ matrix.el }}
          path: dist/*.rpm

      # One file for every other Linux: built here, on the oldest C library, so it runs on anything newer.
      # A failure here leaves the release without an AppImage rather than without a release.
      - name: AppImage
        if: matrix.el == 8
        continue-on-error: true
        shell: bash
        run: |
          set +u; . /opt/rh/gcc-toolset-13/enable; set -u
          AZTEK_QT=/opt/qt/6.8.3/gcc_64 AZTEK_PYTHON=/usr/bin/python3.12 packaging/appimage/build-appimage.sh build appimage

      - uses: actions/upload-artifact@v4
        if: matrix.el == 8
        with:
          name: aztek-appimage
          path: appimage/*.AppImage

  # Each package installed in a clean container, where only its declared dependencies can satisfy it.
  verify-rpm:
    needs: rocky
    runs-on: ubuntu-24.04
    container: rockylinux:${{ matrix.el }}
    strategy:
      fail-fast: false
      matrix:
        el: [8, 9]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: aztek-rpm-el${{ matrix.el }}
          path: pkg

      # Rocky 8 gets no EPEL here: its package must install from the base repositories alone.
      - name: Install
        run: |
          if [ "${{ matrix.el }}" = 9 ]; then dnf -y --setopt=retries=10 install epel-release; fi
          dnf -y --setopt=retries=10 install ./pkg/*.rpm xorg-x11-server-Xvfb xorg-x11-xauth which

      - name: Smoke test
        run: packaging/linux/smoke-test.sh

  verify-deb:
    needs: [linux, ubuntu-2204]
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: aztek-deb-ubuntu${{ matrix.ubuntu }}
          path: pkg

      - name: Install
        run: |
          apt-get update
          apt-get install -y ./pkg/*.deb xvfb xauth

      - name: Smoke test
        run: packaging/linux/smoke-test.sh

  # The AppImage unpacked and started on systems newer than the one it was built on, with no Qt or Python of theirs.
  verify-appimage:
    needs: rocky
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "rolling"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: aztek-appimage
          path: pkg

      - name: Install what a desktop has
        run: |
          apt-get update
          apt-get install -y xvfb xauth file libvulkan1 libgl1 libegl1 libfontconfig1 libfreetype6 libx11-6 libx11-xcb1 libxcb1 libglib2.0-0 libdbus-1-3

      # Unpacked rather than mounted: a container has no FUSE.
      - name: Smoke test
        run: |
          chmod +x pkg/*.AppImage
          pkg/*.AppImage --appimage-extract >/dev/null
          AZTEK_BIN="$PWD/squashfs-root/AppRun" packaging/linux/smoke-test.sh

  # Flatpak and snap: the AppImage that started in the clean systems, repacked for each. Neither can fail the run or
  # hold a release back: one that does not build or start is left out of that release.
  flatpak:
    needs: [gate, verify-appimage]
    if: always() && needs.verify-appimage.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: aztek-appimage
          path: pkg

      - name: Unpack the AppImage
        run: packaging/flatpak/unpack-appimage.sh pkg/*.AppImage packaging/flatpak/AppDir

      # The manifest's own build steps start the program and its Python inside the runtime.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: aztek-${{ needs.gate.outputs.version }}-x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.srlegrand.Aztek.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - uses: actions/upload-artifact@v4
        with:
          name: aztek-flatpak
          path: aztek-*.flatpak

  snap:
    needs: [gate, verify-appimage]
    if: always() && needs.verify-appimage.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: aztek-appimage
          path: pkg

      - name: Unpack the AppImage
        run: |
          packaging/flatpak/unpack-appimage.sh pkg/*.AppImage packaging/snap/AppDir
          echo "${{ needs.gate.outputs.version }}" > packaging/snap/version

      - uses: snapcore/action-build@v1
        id: build
        with:
          path: packaging/snap

      # Installed here as a user would install the file, then started: libraries, the program, Python.
      - name: Install and start it
        run: |
          sudo snap install --dangerous "${{ steps.build.outputs.snap }}"
          sudo snap install mesa-2404
          sudo snap connect aztek:gpu-2404 mesa-2404:gpu-2404 || true
          printf 'import sys, json, ctypes, ssl, sqlite3, zlib\nimport aztek.cmds as cmds\nprint(sys.version, cmds.polyCube())\n' > "$HOME/aztek-check.py"
          QT_QPA_PLATFORM=offscreen snap run aztek --help
          snap run aztek --batch --script "$HOME/aztek-check.py"

      # The window too, where the runner lets a confined program reach its display. Told, not required.
      - name: Start its window
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb xauth
          timeout 180 xvfb-run -a -f "$HOME/aztek-xauth" -s "-screen 0 1280x800x24" snap run aztek --script "$HOME/aztek-check.py" --screenshot "$HOME/aztek-window.png"
          test -s "$HOME/aztek-window.png"

      - uses: actions/upload-artifact@v4
        with:
          name: aztek-snap
          path: ${{ steps.build.outputs.snap }}

  windows:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: pwsh
        run: (Get-Content Cargo.toml) -replace '^version = ".*"', 'version = "${{ needs.gate.outputs.version }}"' | Set-Content Cargo.toml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # setup-python off: left on, this action puts the newest Python first on PATH and the exe links that one.
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: win64_msvc2022_64
          cache: true
          setup-python: false

      - name: Ninja
        run: python -m pip install ninja

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> build/cargo"

      - name: Build
        shell: pwsh
        run: .\build.ps1 -Qt $env:QT_ROOT_DIR

      # The real binary: a clean script exits 0, the basics pass, a failing script exits 1.
      - name: Batch
        shell: pwsh
        run: |
          $exe = "build\dist\aztek.exe"
          $p = Start-Process $exe -ArgumentList "--batch", "--script", "crates\aztek_host\tests\batch\basics.py" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "basics: exit code $($p.ExitCode)" }
          $p = Start-Process $exe -ArgumentList "--batch", "--command", "error `"no`";" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 1) { throw "a failing script gave exit code $($p.ExitCode), not 1" }

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path build\dist\* -DestinationPath aztek-windows-x86_64.zip
          .\packaging\windows\build-installer.ps1 -OutputDir dist

      - name: Installer check
        shell: pwsh
        run: .\packaging\windows\smoke-test.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: aztek-windows-x86_64
          path: aztek-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: aztek-windows-setup
          path: dist/*.exe

  # Apple silicon. Not yet a condition of a release: a failure here leaves the other packages to go out without it.
  macos:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: macos-15
    # Without this the app would ask for the runner's own macOS.
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: sed -i '' 's/^version = ".*"/version = "${{ needs.gate.outputs.version }}"/' Cargo.toml

      - name: Dependencies
        run: brew install ninja python@3.12 molten-vk

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            . -> build/cargo

      - name: Test
        continue-on-error: true
        run: PYO3_PYTHON="$(brew --prefix python@3.12)/bin/python3.12" cargo test --workspace --no-fail-fast

      # The same script as on a Mac: Aztek.app with Qt and MoltenVK inside, signed ad hoc, zipped with the examples.
      # Python stays Homebrew's python@3.12. Qt is the one installed above, through QT_ROOT_DIR.
      - name: Build and package
        run: ./build-macos.sh --package

      - name: Batch
        continue-on-error: true
        run: AZTEK_BIN="$PWD/build/aztek.app/Contents/MacOS/aztek" PYO3_PYTHON="$(brew --prefix python@3.12)/bin/python3.12" cargo test -p aztek_host --no-fail-fast --test batch --test basics --test basics_python

      - name: Check
        run: otool -L dist/Aztek/Aztek.app/Contents/MacOS/aztek

      - uses: actions/upload-artifact@v4
        with:
          name: aztek-macos-arm64
          path: dist/aztek-macos-arm64.zip

  # Every push to main replaces the "latest" pre-release; a v* tag makes a versioned release.
  release:
    needs: [gate, linux, ubuntu-2204, rocky, verify-rpm, verify-deb, verify-appimage, flatpak, snap, windows, macos]
    if: >-
      always() && needs.gate.outputs.go == 'true'
      && needs.linux.result == 'success' && needs.ubuntu-2204.result == 'success' && needs.rocky.result == 'success'
      && needs.verify-rpm.result == 'success' && needs.verify-deb.result == 'success' && needs.windows.result == 'success'
      && (github.event_name == 'push' || github.event_name == 'schedule')
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # Only an AppImage that started in the clean systems is released. The Flatpak and the snap are made from it, and
      # only once each has started: one that failed uploaded nothing.
      - name: Unverified AppImage
        if: needs.verify-appimage.result != 'success'
        run: rm -f aztek-*.AppImage aztek-*.flatpak aztek_*.snap

      - name: Release
        if: github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          tag="v$VERSION"
          short="${VERSION%.0} (${GITHUB_SHA::7})"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" aztek-* aztek_* --target "$GITHUB_SHA" --latest --title "Aztek $short" \
              --notes "Built $(date -u '+%d/%m/%Y %H:%M') UTC from $GITHUB_SHA." --generate-notes
          fi
          # The old rolling pre-release, from before builds had numbers of their own.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

      - name: Versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" aztek-* aztek_* \
            --title "Aztek $GITHUB_REF_NAME" --generate-notes
