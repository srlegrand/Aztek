name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # A fresh set of packages every hour, if main has moved since the last one.
  schedule:
    - cron: "7 * * * *"

# A build in progress finishes: cancelling it for each push meant a busy day released nothing. One newer run waits.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

# Slow and sure: every build here runs two jobs at a time, so a runner never runs out of memory, and every download is
# tried again before it fails. A step that still fails is run again (tools/ci/retry.sh) with one job at a time.
env:
  CARGO_BUILD_JOBS: 2
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  RUST_TEST_THREADS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 300
  CARGO_TERM_COLOR: never
  PIP_RETRIES: 10
  PIP_DEFAULT_TIMEOUT: 120
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  # Whether there's anything to build: only the hourly run can find nothing new.
  gate:
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.check.outputs.go }}
      version: ${{ steps.check.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The version a user sees: 2.<commits on main>, so every build is newer than the last and says so.
      - id: check
        run: |
          version="2.$(git rev-list --count HEAD).0"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          go=true
          if [ "${{ github.event_name }}" = "schedule" ] && gh release view "v$version" >/dev/null 2>&1; then
            go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "Building $version: $go"

  # The plug-in kit and the shipped plug-ins under clang (as on macOS) and GCC, in a minute: a compile error shows here
  # before the long builds reach it.
  kit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: tools/check_kit.sh

  linux:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: tools/ci/free-disk.sh

      - name: Version
        shell: bash
        run: sed -i 's/^version = ".*"/version = "${{ needs.gate.outputs.version }}"/' Cargo.toml

      - name: Dependencies
        run: |
          tools/ci/retry.sh 5 bash -c 'sudo apt-get -o Acquire::Retries=10 update && sudo apt-get -o Acquire::Retries=10 install -y build-essential dpkg-dev cmake ninja-build qt6-base-dev libvulkan-dev python3-dev xvfb xdotool imagemagick openbox mesa-vulkan-drivers'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            . -> build/cargo

      - name: Test
        run: tools/ci/retry.sh 2 cargo test --workspace

      - name: Build
        run: tools/ci/retry.sh 3 ./build.sh

      # The real binary with no display: exit statuses, then the basics end to end.
      - name: Batch
        run: AZTEK_BIN="$PWD/build/aztek" tools/ci/retry.sh 2 cargo test -p aztek_host --test batch --test basics --test basics_python

      - name: Examples
        run: tools/ci/retry.sh 2 tools/check_examples.sh build/aztek

      - name: Channel Box under Xvfb
        run: tools/ci/retry.sh 2 python3 tools/ui_checks/channel_box.py build/aztek

      - name: Package
        run: |
          tar -czf aztek-linux-x86_64.tar.gz -C build aztek -C .. examples
          tools/ci/retry.sh 3 packaging/deb/build-deb.sh build dist

      - uses: actions/upload-artifact@v4
        with:
          name: aztek-linux-x86_64
          path: aztek-linux-x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: aztek-deb-ubuntu24.04
          path: dist/*.deb

  # Ubuntu 22.04 has Qt 6.2 and Python 3.10, so it gets its own package.
  ubuntu-2204:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    container:
      image: ubuntu:22.04
      volumes:
        - /usr/share/dotnet:/host/usr/share/dotnet
        - /usr/local/lib/android:/host/usr/local/lib/android
        - /opt/ghc:/host/opt/ghc
        - /usr/local/.ghcup:/host/usr/local/.ghcup
        - /opt/hostedtoolcache/CodeQL:/host/opt/hostedtoolcache/CodeQL
        - /usr/local/share/powershell:/host/usr/local/share/powershell
        - /usr/local/share/chromium:/host/usr/local/share/chromium
    steps:
      - uses: actions/checkout@v4

      # The runner's unused SDKs, seen through the container's volumes: the build needs the room.
      - name: Free disk
        run: tools/ci/free-disk.sh /host

      - name: Version
        shell: bash
        run: sed -i 's/^version = ".*"/version = "${{ needs.gate.outputs.version }}"/' Cargo.toml

      - name: Dependencies
        run: |
          for i in 1 2 3 4 5; do
            apt-get -o Acquire::Retries=10 update && apt-get -o Acquire::Retries=10 install -y build-essential dpkg-dev cmake ninja-build qt6-base-dev libgl-dev libvulkan-dev python3-dev ca-certificates curl file && break
            [ "$i" = 5 ] && exit 1
            sleep $((i * 60))
          done

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            . -> build/cargo

      - name: Test
        run: tools/ci/retry.sh 2 cargo test --workspace

      - name: Package
        run: tools/ci/retry.sh 3 packaging/deb/build-deb.sh build dist

      - uses: actions/upload-artifact@v4
        with:
          name: aztek-deb-ubuntu22.04
          path: dist/*.deb

  # Rocky 8 has no Qt 6 packages, so its RPM bundles Qt 6.8 from aqtinstall. Rocky 9 uses EPEL's Qt.
  rocky:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    container:
      image: rockylinux:${{ matrix.el }}
      volumes:
        - /usr/share/dotnet:/host/usr/share/dotnet
        - /usr/local/lib/android:/host/usr/local/lib/android
        - /opt/ghc:/host/opt/ghc
        - /usr/local/.ghcup:/host/usr/local/.ghcup
        - /opt/hostedtoolcache/CodeQL:/host/opt/hostedtoolcache/CodeQL
        - /usr/local/share/powershell:/host/usr/local/share/powershell
        - /usr/local/share/chromium:/host/usr/local/share/chromium
    strategy:
      fail-fast: false
      matrix:
        el: [8, 9]
    env:
      PYO3_PYTHON: /usr/bin/python3.12
    steps:
      - uses: actions/checkout@v4

      # The runner's unused SDKs, seen through the container's volumes: the build needs the room.
      - name: Free disk
        run: tools/ci/free-disk.sh /host

      - name: Version
        shell: bash
        run: sed -i 's/^version = ".*"/version = "${{ needs.gate.outputs.version }}"/' Cargo.toml

      - name: Dependencies
        run: tools/ci/retry.sh 5 packaging/rpm/install-build-deps.sh

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: el${{ matrix.el }}
          workspaces: |
            . -> target
            . -> build/cargo

      - name: Qt cache
        if: matrix.el == 8
        uses: actions/cache@v4
        with:
          path: /opt/qt
          key: qt-6.8.3-el8

      - name: Test
        run: tools/ci/retry.sh 2 cargo test --workspace

      - name: RPM
        run: tools/ci/retry.sh 3 packaging/rpm/build-rpm.sh build dist

      - uses: actions/upload-artifact@v4
        with:
          name: aztek-rpm-el${{ matrix.el }}
          path: dist/*.rpm

      # One file for every other Linux: built here, on the oldest C library, so it runs on anything newer.
      # A failure here leaves the release without an AppImage rather than without a release.
      - name: AppImage
        if: matrix.el == 8
        continue-on-error: true
        shell: bash
        run: |
          set +u; . /opt/rh/gcc-toolset-13/enable; set -u
          AZTEK_QT=/opt/qt/6.8.3/gcc_64 AZTEK_PYTHON=/usr/bin/python3.12 tools/ci/retry.sh 3 packaging/appimage/build-appimage.sh build appimage

      - uses: actions/upload-artifact@v4
        if: matrix.el == 8
        with:
          name: aztek-appimage
          path: appimage/*.AppImage

  # Each package installed in a clean container, where only its declared dependencies can satisfy it.
  verify-rpm:
    needs: rocky
    runs-on: ubuntu-24.04
    container: rockylinux:${{ matrix.el }}
    strategy:
      fail-fast: false
      matrix:
        el: [8, 9]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: aztek-rpm-el${{ matrix.el }}
          path: pkg

      # Rocky 8 gets no EPEL here: its package must install from the base repositories alone.
      - name: Install
        run: |
          for i in 1 2 3 4 5; do
            { [ "${{ matrix.el }}" != 9 ] || dnf -y --setopt=retries=10 install epel-release; } \
              && dnf -y --setopt=retries=10 install ./pkg/*.rpm xorg-x11-server-Xvfb xorg-x11-xauth which && break
            [ "$i" = 5 ] && exit 1
            dnf clean all; sleep $((i * 60))
          done

      - name: Smoke test
        run: tools/ci/retry.sh 2 packaging/linux/smoke-test.sh

  verify-deb:
    needs: [linux, ubuntu-2204]
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: aztek-deb-ubuntu${{ matrix.ubuntu }}
          path: pkg

      - name: Install
        run: |
          for i in 1 2 3 4 5; do
            apt-get -o Acquire::Retries=10 update && apt-get -o Acquire::Retries=10 install -y ./pkg/*.deb xvfb xauth && break
            [ "$i" = 5 ] && exit 1
            sleep $((i * 60))
          done

      - name: Smoke test
        run: tools/ci/retry.sh 2 packaging/linux/smoke-test.sh

  # The AppImage unpacked and started on systems newer than the one it was built on, with no Qt or Python of theirs.
  verify-appimage:
    needs: rocky
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "rolling"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: aztek-appimage
          path: pkg

      - name: Install what a desktop has
        run: |
          for i in 1 2 3 4 5; do
            apt-get -o Acquire::Retries=10 update && apt-get -o Acquire::Retries=10 install -y xvfb xauth file libvulkan1 libgl1 libegl1 libfontconfig1 libfreetype6 libx11-6 libx11-xcb1 libxcb1 libglib2.0-0 libdbus-1-3 && break
            [ "$i" = 5 ] && exit 1
            sleep $((i * 60))
          done

      # Unpacked rather than mounted: a container has no FUSE.
      - name: Smoke test
        run: |
          chmod +x pkg/*.AppImage
          pkg/*.AppImage --appimage-extract >/dev/null
          AZTEK_BIN="$PWD/squashfs-root/AppRun" tools/ci/retry.sh 2 packaging/linux/smoke-test.sh

  # Flatpak: the AppImage that started in the clean systems, repacked. It can't fail the run or hold a release back:
  # one that does not build or start is left out of that release.
  flatpak:
    needs: [gate, verify-appimage]
    if: always() && needs.verify-appimage.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: aztek-appimage
          path: pkg

      - name: Unpack the AppImage
        run: packaging/flatpak/unpack-appimage.sh pkg/*.AppImage packaging/flatpak/AppDir

      # The manifest's own build steps start the program and its Python inside the runtime.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: aztek-${{ needs.gate.outputs.version }}-x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.srlegrand.Aztek.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - uses: actions/upload-artifact@v4
        with:
          name: aztek-flatpak
          path: aztek-*.flatpak

  windows:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: windows-2022
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: pwsh
        run: (Get-Content Cargo.toml) -replace '^version = ".*"', 'version = "${{ needs.gate.outputs.version }}"' | Set-Content Cargo.toml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # setup-python off: left on, this action puts the newest Python first on PATH and the exe links that one.
      # Qt's servers drop downloads now and then: a second try after a pause.
      - id: qt
        continue-on-error: true
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: win64_msvc2022_64
          cache: true
          setup-python: false

      - if: steps.qt.outcome == 'failure'
        shell: pwsh
        run: Start-Sleep -Seconds 120

      - if: steps.qt.outcome == 'failure'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: win64_msvc2022_64
          cache: true
          setup-python: false

      - name: Ninja
        run: python -m pip install ninja

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> build/cargo"

      # Tried three times; after a failure, one job at a time.
      - name: Build
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            $ok = $false
            $global:LASTEXITCODE = 0
            try {
              .\build.ps1 -Qt $env:QT_ROOT_DIR
              $ok = ($LASTEXITCODE -eq 0)
            } catch {
              Write-Host $_
            }
            if ($ok) { exit 0 }
            if ($i -eq 3) { throw "build failed 3 times" }
            Write-Host "::warning::build attempt $i failed; trying again with one job at a time"
            $env:CARGO_BUILD_JOBS = "1"; $env:CMAKE_BUILD_PARALLEL_LEVEL = "1"
            Start-Sleep -Seconds (60 * $i)
          }

      # The real binary: a clean script exits 0, the basics pass, a failing script exits 1.
      - name: Batch
        shell: pwsh
        run: |
          $exe = "build\dist\aztek.exe"
          $p = Start-Process $exe -ArgumentList "--batch", "--script", "crates\aztek_host\tests\batch\basics.py" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "basics: exit code $($p.ExitCode)" }
          $p = Start-Process $exe -ArgumentList "--batch", "--command", "error `"no`";" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 1) { throw "a failing script gave exit code $($p.ExitCode), not 1" }

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path build\dist\* -DestinationPath aztek-windows-x86_64.zip
          .\packaging\windows\build-installer.ps1 -OutputDir dist

      - name: Installer check
        shell: pwsh
        run: .\packaging\windows\smoke-test.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: aztek-windows-x86_64
          path: aztek-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: aztek-windows-setup
          path: dist/*.exe

  # Apple silicon. Not yet a condition of a release: a failure here leaves the other packages to go out without it.
  macos:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: macos-15
    timeout-minutes: 340
    # Without this the app would ask for the runner's own macOS.
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: sed -i '' 's/^version = ".*"/version = "${{ needs.gate.outputs.version }}"/' Cargo.toml

      - name: Dependencies
        run: tools/ci/retry.sh 5 brew install ninja python@3.12 molten-vk

      - id: qt
        continue-on-error: true
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - if: steps.qt.outcome == 'failure'
        run: sleep 120

      - if: steps.qt.outcome == 'failure'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            . -> build/cargo

      - name: Test
        continue-on-error: true
        run: PYO3_PYTHON="$(brew --prefix python@3.12)/bin/python3.12" cargo test --workspace --no-fail-fast

      # The same script as on a Mac: Aztek.app with Qt and MoltenVK inside, signed ad hoc, zipped with the examples.
      # Python stays Homebrew's python@3.12. Qt is the one installed above, through QT_ROOT_DIR.
      - name: Build and package
        run: tools/ci/retry.sh 3 ./build-macos.sh --package

      - name: Batch
        continue-on-error: true
        run: AZTEK_BIN="$PWD/build/aztek.app/Contents/MacOS/aztek" PYO3_PYTHON="$(brew --prefix python@3.12)/bin/python3.12" cargo test -p aztek_host --no-fail-fast --test batch --test basics --test basics_python

      - name: Check
        run: otool -L dist/Aztek/Aztek.app/Contents/MacOS/aztek

      - uses: actions/upload-artifact@v4
        with:
          name: aztek-macos-arm64
          path: dist/aztek-macos-arm64.zip

  # Every push to main makes a release of what built; a v* tag makes a versioned release. A platform that failed is
  # left out of that release and named in its notes: one platform failing holds back none of the others.
  release:
    needs: [gate, linux, ubuntu-2204, rocky, verify-rpm, verify-deb, verify-appimage, flatpak, windows, macos]
    if: >-
      always() && needs.gate.outputs.go == 'true'
      && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # Only what started in a clean system goes out. A job that failed uploaded nothing; a package that built but did
      # not install and start is taken out here.
      - name: Keep what was checked
        id: keep
        run: |
          shopt -s nullglob
          missing=()
          [ "${{ needs.linux.result }}" = success ] || missing+=("Linux tar.gz, Ubuntu 24.04 .deb")
          [ "${{ needs.ubuntu-2204.result }}" = success ] || missing+=("Ubuntu 22.04 .deb")
          [ "${{ needs.rocky.result }}" = success ] || missing+=("Rocky .rpm, AppImage, Flatpak")
          [ "${{ needs.windows.result }}" = success ] || missing+=("Windows")
          [ "${{ needs.macos.result }}" = success ] || missing+=("macOS")
          if [ "${{ needs.verify-rpm.result }}" != success ]; then rm -f aztek-*.rpm; missing+=("Rocky .rpm (did not install and start)"); fi
          if [ "${{ needs.verify-deb.result }}" != success ]; then rm -f aztek_*.deb; missing+=("Ubuntu .deb (did not install and start)"); fi
          if [ "${{ needs.verify-appimage.result }}" != success ]; then rm -f aztek-*.AppImage aztek-*.flatpak; missing+=("AppImage and Flatpak (did not start)"); fi
          [ "${{ needs.flatpak.result }}" = success ] || missing+=("Flatpak")
          files=(aztek-* aztek_*)
          printf '%s\n' "${files[@]}" > files.txt
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<EOF"
            echo "Built $(date -u '+%d/%m/%Y %H:%M') UTC from $GITHUB_SHA."
            if [ ${#missing[@]} -gt 0 ]; then
              echo
              echo "Not in this release, as its build or check failed: $(IFS=';'; echo "${missing[*]}" | sed 's/;/; /g'). The release before has them."
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cat files.txt

      - name: Release
        if: github.ref == 'refs/heads/main' && steps.keep.outputs.count != '0'
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          NOTES: ${{ steps.keep.outputs.notes }}
        run: |
          tag="v$VERSION"
          short="${VERSION%.0} (${GITHUB_SHA::7})"
          mapfile -t files < files.txt
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --latest --title "Aztek $short" \
              --notes "$NOTES" --generate-notes
          fi
          # The old rolling pre-release, from before builds had numbers of their own.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

      - name: Versioned release
        if: startsWith(github.ref, 'refs/tags/v') && steps.keep.outputs.count != '0'
        env:
          NOTES: ${{ steps.keep.outputs.notes }}
        run: |
          mapfile -t files < files.txt
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "Aztek $GITHUB_REF_NAME" --notes "$NOTES" --generate-notes
