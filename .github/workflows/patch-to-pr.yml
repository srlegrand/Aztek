# A "Send a patch" issue (the patch label) becomes a pull request: the patch is applied to main on a branch
# patch/issue-N and the pull request is linked on the issue. Nothing of the patch is built or run here.
name: Patch to pull request

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: patch-to-pr-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pull-request:
    if: contains(github.event.issue.labels.*.name, 'patch') && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_AUTHOR_ID: ${{ github.event.issue.user.id }}
        run: python3 .github/scripts/patch_to_pr.py
